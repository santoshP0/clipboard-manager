[package]
name = "memory"
version = "1.1.0"
description = "Stash — clipboard manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
  "protocol-asset",
] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
tauri-plugin-window-state = "2"
tauri-plugin-process = "2"

# Dock tile, set at runtime — see set_dock_icon.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
# Snippet expansion: block2 for the key monitor's handler, core-graphics to
# synthesize the replacement keystrokes.
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.12.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
